name: Ice Watch alerts

on:
  schedule:
    # Times are UTC. Covers Eastern game windows in both EDT and EST.
    - cron: "*/5 13-23 * * 0"   # Sunday: London game through the 4:00 slate
    - cron: "*/5 0-5 * * 1"     # Sunday night game (late Sunday Eastern)
    - cron: "*/5 0-5 * * 2"     # Monday night game
    - cron: "*/5 0-5 * * 5"     # Thursday night game
    - cron: "*/5 17-23 * * 6"   # Saturday games (late season)
    - cron: "*/5 0-5 * * 0"     # Saturday night games (late season)
  workflow_dispatch: {}          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: ice-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ESPN and send alerts
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          TRACKER_URL: ${{ vars.TRACKER_URL }}
        run: python icewatch_alerts.py
      - name: Remember which alerts were sent
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "ice-watch-bot"
            git config user.email "ice-watch-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update sent alerts"
            git push
          fi
